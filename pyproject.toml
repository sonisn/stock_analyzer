[project]
name = "stock-analyzer"
version = "0.1.0"
description = "Personal portfolio analyzer with insider/political trade signals."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "agno[os]>=3.0.9",
    "anthropic>=1.0.0",
    "finnhub-python>=2.4",
    "google-genai>=1.75.0",
    "httpx>=0.28",
    "openai>=3.14.0",
    "orjson>=3.10",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0.0",
    "reportlab>=5.0.1",
    "ruff>=0.15.12",
    "snaptrade-python-sdk>=13.0.21",
    "sqlmodel>=0.0.22",
    "tavily-python>=0.7.24",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
markers = [
    "allow_network: test is allowed to open real network connections (see tests/conftest.py)",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
    "RET", # flake8-return
]
ignore = [
    "E501",  # line-too-long — let the formatter own this
    "B008",  # function-call-in-default — Pydantic Field(default_factory=...) is fine
]

[project.scripts]
analyze-portfolio = "stock_analyzer.cli.portfolio:main"
analyze-insiders = "stock_analyzer.cli.insider:main"
discover-stocks = "stock_analyzer.cli.discover:main"
rebalance-portfolio = "stock_analyzer.cli.rebalance:main"
validate-screen = "stock_analyzer.cli.validate_screen:main"
train-model = "stock_analyzer.cli.train_model:main"
model-review = "stock_analyzer.cli.model_review:main"
quarterly-review = "stock_analyzer.cli.quarterly_review:main"
tax-planner = "stock_analyzer.cli.tax_planner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_analyzer"]
