[project]
name = "stock-analyzer"
version = "0.1.0"
description = "Personal portfolio analyzer with insider/political trade signals."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "agno>=3.0.11",
    "anthropic>=1.8.0",
    "finnhub-python>=2.4",
    "google-genai>=2.25.0",
    "httpx>=0.28",
    "numpy>=2.5",
    "openai>=3.19.2",
    "orjson>=3.10",
    "pandas>=3.0",
    "pyarrow>=25.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0.0",
    "reportlab>=5.0.1",
    "rich>=15.0",
    "snaptrade-python-sdk>=13.0.26",
    "sqlalchemy>=2.0.54,<2.1",  # sqlmodel 0.0.47 caps it below 2.1
    "sqlmodel>=0.0.47",
    "tavily-python>=0.8.4",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
markers = [
    "allow_network: test is allowed to open real network connections (see tests/conftest.py)",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# Old design docs: their code snippets are a record, not code to keep formatted.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
    "RET", # flake8-return
]
ignore = [
    "E501",  # line-too-long — let the formatter own this
    "B008",  # function-call-in-default — Pydantic Field(default_factory=...) is fine
]

[project.scripts]
stock-analyzer = "stock_analyzer.cli.main:main"
analyze-portfolio = "stock_analyzer.cli.portfolio:main"
analyze-insiders = "stock_analyzer.cli.insider:main"
discover-stocks = "stock_analyzer.cli.discover:main"
rebalance-portfolio = "stock_analyzer.cli.rebalance:main"
validate-screen = "stock_analyzer.cli.validate_screen:main"
train-model = "stock_analyzer.cli.train_model:main"
model-review = "stock_analyzer.cli.model_review:main"
quarterly-review = "stock_analyzer.cli.quarterly_review:main"
tax-planner = "stock_analyzer.cli.tax_planner:main"
plan-check = "stock_analyzer.cli.plan_check:main"
replay-rebalance = "stock_analyzer.cli.replay_rebalance:main"
dashboard = "stock_analyzer.cli.dashboard:main"
score-attribution = "stock_analyzer.cli.score_attribution:main"
ops = "stock_analyzer.cli.ops:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_analyzer"]
